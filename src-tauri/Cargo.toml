[package]
name = "zconvert"
version = "0.1.0"
description = "ZConvert — Privacy-first local file converter"
authors = []
edition = "2021"

[lib]
name = "zconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
infer = "0.16"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures = "0.3"

# Image
image = { version = "0.25", default-features = false, features = [
  "jpeg", "png", "gif", "bmp", "tiff", "webp", "ico"
] }
# AVIF encoding — disable nasm (asm feature) so nasm assembler is not required
ravif = { version = "0.11", default-features = false, features = [] }
# Explicitly override rav1e to disable asm to avoid requiring nasm
rav1e = { version = "0.7", default-features = false, features = ["threading", "serialize"] }
rgb = "0.8"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
rawler = "0.6"
little_exif = "0.5"
libheif-rs = "1"

# Document
lopdf = "0.34"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
calamine = "0.26"

# Data
csv = "1"
